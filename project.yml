name: supersimple
options:
  bundleIdPrefix: com.frinfo702
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SDKROOT: macosx
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: ""
targets:
  supersimple:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: SupersimpleCore
      - package: MarkdownEngine
      - package: MarkdownEngineLatex
      - package: GhosttyKit
        product: GhosttyTerminal
      - target: SupersimpleUpdater
        embed: true
        copy:
          destination: plugins
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleName: supersimple
        CFBundleDisplayName: supersimple
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright 2026"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frinfo702.supersimple
        CODE_SIGN_ENTITLEMENTS: App/Resources/Supersimple.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SupersimpleUpdater:
    type: application
    platform: macOS
    sources:
      - path: Updater
      - path: App/App/PendingUpdateInstall.swift
      - path: App/App/AppBundleInstaller.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frinfo702.supersimple.updater
        PRODUCT_NAME: SupersimpleUpdater
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: SupersimpleUpdater
  supersimpleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: supersimpleTests
    dependencies:
      - target: supersimple
      - package: SupersimpleCore
      - package: GhosttyKit
        product: GhosttyTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frinfo702.supersimpleTests
        GENERATE_INFOPLIST_FILE: YES
  supersimpleUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: supersimpleUITests
    dependencies:
      - target: supersimple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frinfo702.supersimpleUITests
        GENERATE_INFOPLIST_FILE: YES
packages:
  SupersimpleCore:
    path: Packages/SupersimpleCore
  MarkdownEngine:
    path: Packages/swift-markdown-engine
    productName: MarkdownEngine
  MarkdownEngineLatex:
    path: Packages/swift-markdown-engine
    productName: MarkdownEngineLatex
  GhosttyKit:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 1.3.2
schemes:
  supersimple:
    build:
      targets:
        supersimple: all
    test:
      targets:
        - supersimpleTests
        - supersimpleUITests
    run:
      config: Debug