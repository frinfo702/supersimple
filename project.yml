name: supersimple
options:
  bundleIdPrefix: com.frinfo702
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SDKROOT: macosx
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: ""
targets:
  supersimple:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: SupersimpleCore
      - package: MarkdownEngine
      - package: MarkdownEngineLatex
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleName: supersimple
        CFBundleDisplayName: supersimple
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright 2026"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frinfo702.supersimple
        CODE_SIGN_ENTITLEMENTS: App/Resources/Supersimple.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  supersimpleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: supersimpleTests
    dependencies:
      - target: supersimple
      - package: SupersimpleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frinfo702.supersimpleTests
        GENERATE_INFOPLIST_FILE: YES
  supersimpleUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: supersimpleUITests
    dependencies:
      - target: supersimple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frinfo702.supersimpleUITests
        GENERATE_INFOPLIST_FILE: YES
packages:
  SupersimpleCore:
    path: Packages/SupersimpleCore
  MarkdownEngine:
    path: Packages/swift-markdown-engine
    productName: MarkdownEngine
  MarkdownEngineLatex:
    path: Packages/swift-markdown-engine
    productName: MarkdownEngineLatex
schemes:
  supersimple:
    build:
      targets:
        supersimple: all
    test:
      targets:
        - supersimpleTests
        - supersimpleUITests
    run:
      config: Debug